schema = 1

[profile]
id = "catos-sway-default"
name = "CatOS Sway Default"
description = "Supported CatOS Sway desktop profile"

[defaults]
wm = "sway"
bar = "waybar"
launcher = "fuzzel"
notifications = "mako"
terminal = "foot"
browser = "firefox"
editor = "neovim"

[components.sway]
role = "wm"
path = "sway"
packages = ["sway"]
exec = ["sway", "--config", "{component}/config"]

[[components.sway.links]]
source = "config"
target = "{xdg_config_home}/sway/config"

[components.waybar]
role = "bar"
path = "waybar"
packages = ["waybar"]
exec = ["waybar", "--config", "{component}/config.jsonc"]

[components.fuzzel]
role = "launcher"
path = "fuzzel"
packages = ["fuzzel"]
exec = ["fuzzel", "--config", "{component}/fuzzel.ini"]

[components.mako]
role = "notifications"
path = "mako"
packages = ["mako"]
exec = ["mako", "--config", "{component}/config"]

[components.foot]
role = "terminal"
path = "foot"
packages = ["foot"]
exec = ["foot", "--config", "{component}/foot.ini"]

[components.firefox]
role = "browser"
path = "firefox"
packages = ["firefox"]
exec = ["firefox"]

[components.neovim]
role = "editor"
path = "neovim"
packages = ["neovim"]
exec = ["nvim"]
