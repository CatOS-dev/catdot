schema = 1

[profile]
id = "catos-niri-default"
name = "CatOS Niri Default"
description = "Supported CatOS Niri desktop profile"

[defaults]
wm = "niri"
bar = "waybar"
launcher = "fuzzel"
notifications = "mako"
terminal = "foot"
browser = "firefox"
editor = "neovim"

[components.niri]
role = "wm"
path = "niri"
packages = ["niri"]
exec = ["niri", "--config", "{component}/config.kdl"]

[[components.niri.links]]
source = "config.kdl"
target = "{xdg_config_home}/niri/config.kdl"

[components.waybar]
role = "bar"
path = "waybar"
packages = ["waybar"]
exec = ["waybar", "--config", "{component}/config.jsonc", "--style", "{component}/style.css"]

[components.fuzzel]
role = "launcher"
path = "fuzzel"
packages = ["fuzzel"]
exec = ["fuzzel", "--config", "{component}/fuzzel.ini"]

[components.mako]
role = "notifications"
path = "mako"
packages = ["mako"]
exec = ["mako", "--config", "{component}/config"]

[components.foot]
role = "terminal"
path = "foot"
packages = ["foot"]
exec = ["foot", "--config", "{component}/foot.ini"]

[components.firefox]
role = "browser"
path = "firefox"
packages = ["firefox"]
exec = ["firefox"]

[components.neovim]
role = "editor"
path = "neovim"
packages = ["neovim"]
exec = ["nvim"]
