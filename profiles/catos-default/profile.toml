schema = 1

[profile]
id = "catos-default"
name = "CatOS Default"
description = "Default CatOS GTK and Qt appearance profile"

[defaults]
gtk-theme = "gtk"
qt-theme = "qt"

[components.gtk]
role = "gtk-theme"
path = "gtk"
backend = "gtk"
packages = ["catos-graphite-gtk-theme", "tela-icon-theme-git", "catos-bibata-cursor"]

[components.gtk.settings]
theme = "Graphite-Dark-nord"
icon_theme = "Tela-blue-dark"
cursor_theme = "Bibata-Modern-Ice"
font = "Noto Sans 10"
color_scheme = "prefer-dark"

[components.qt]
role = "qt-theme"
path = "qt"
backend = "qtct-kvantum"
packages = ["qt5ct", "qt6ct", "kvantum"]

[components.qt.settings]
qt5_style = "kvantum"
qt6_style = "kvantum"
kvantum_theme = "KvantumAlt"
icon_theme = "Tela-blue-dark"
