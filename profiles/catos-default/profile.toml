schema = 2

[profile]
id = "catos-default"
name = "CatOS Default"
description = "Default CatOS GTK settings"
source_root = "/etc/skel"

[defaults]
gtk-theme = "gtk"

[[components]]
id = "gtk"
role = "gtk-theme"
packages = [
  "catos-gtk-settings",
  "catos-graphite-gtk-theme>=1.0-3",
  "catos-tela-icon-theme-blue",
  "catos-bibata-cursor",
]

[[components.configuration]]
target = ".gtkrc-2.0"
lifecycle = "overwrite"
mode = "file"
source = ".gtkrc-2.0"

[[components.configuration]]
target = ".config/gtk-3.0/settings.ini"
lifecycle = "overwrite"
mode = "file"
source = ".config/gtk-3.0/settings.ini"

[[components.configuration]]
target = ".config/gtk-4.0/settings.ini"
lifecycle = "overwrite"
mode = "file"
source = ".config/gtk-4.0/settings.ini"

[[components.configuration]]
target = ".config/gtk-4.0/gtk.css"
lifecycle = "overwrite"
mode = "file"
source = ".config/gtk-4.0/gtk.css"

[[components.configuration]]
target = ".config/gtk-4.0/assets"
lifecycle = "overwrite"
mode = "file"
source = ".config/gtk-4.0/assets"
