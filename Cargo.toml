[workspace]
members = ["crates/catdot-core", "crates/catdot-cli", "crates/catdot-helper"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
homepage = "https://github.com/CatOS-dev/catdot"
repository = "https://github.com/CatOS-dev/catdot"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
tempfile = "3.15"
thiserror = "2.0"
toml = "0.8"
